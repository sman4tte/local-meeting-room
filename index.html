<style>
  :root { --bg:#12161c; --panel:#1b222c; --line:#2b3542; --text:#e8edf3; --mute:#8d9aab; --accent:#5cc24a; --danger:#e5534b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  button,input { font:inherit; color:inherit; }
  input { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; }
  button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:#06231b; border-color:var(--accent); font-weight:600; }
  button.off { background:var(--danger); border-color:var(--danger); }
  button.on { border-color:var(--accent); color:var(--accent); }
  #join { min-height:100%; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); }
  .cover { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:40px 28px;
    background:linear-gradient(160deg,#14532d 0%,#0f3320 55%,#12161c 100%); border-right:1px solid var(--line); }
  .cover .logo { width:min(320px,62%); height:auto; filter:drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  .cover h1 { margin:0; font-size:clamp(28px,4.2vw,52px); font-weight:800; letter-spacing:.06em; line-height:1.1; }
  .cover p { margin:0; font-size:clamp(15px,1.6vw,20px); color:#cfe8d5; }
  .cover small { color:#8fb59a; }
  .formside { display:grid; place-items:center; padding:28px 20px; }
  #join form { width:min(360px,100%); display:grid; gap:12px; }
  #join h2 { margin:0; font-size:22px; }
  p.sub { margin:0 0 8px; color:var(--mute); }
  .mini { width:28px; height:28px; object-fit:contain; vertical-align:middle; margin-right:6px; }
  @media (max-width:800px){ #join { grid-template-columns:1fr; } .cover { padding:28px 20px; border-right:0; border-bottom:1px solid var(--line); } .cover .logo { width:150px; } }
  #call { display:none; height:100%; grid-template-columns:1fr; grid-template-rows:1fr auto; }
  #call.open { display:grid; }
  .main { display:flex; min-height:0; }
  #grid { flex:1; display:grid; gap:10px; padding:10px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); grid-auto-rows:minmax(160px,1fr); overflow:auto; }
  .tile { position:relative; background:#000; border-radius:10px; overflow:hidden; min-height:160px; }
  .tile video { width:100%; height:100%; object-fit:cover; }
  .tile.me video { transform:scaleX(-1); }
  .tile.me.screen video { transform:none; object-fit:contain; }
  .tile span { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:6px; font-size:13px; }
  #chat { width:300px; border-left:1px solid var(--line); display:none; flex-direction:column; background:var(--panel); }
  #chat.open { display:flex; }
  #msgs { flex:1; overflow:auto; padding:12px; display:grid; gap:8px; align-content:start; }
  #msgs b { color:var(--accent); }
  #chat form { display:flex; gap:6px; padding:8px; border-top:1px solid var(--line); }
  .bar { display:flex; justify-content:center; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .bar .room { color:var(--mute); margin-right:auto; }
  #timer { color:var(--mute); font-variant-numeric:tabular-nums; }
  @media (max-width:700px){ #chat { position:fixed; inset:0 0 60px 0; width:auto; z-index:5; } .bar .room{display:none;} }
</style>
</head>
<body>
<section id="join">
  <div class="cover">
    <img data-logo class="logo" alt="Logo SMA Negeri 4 Kota Ternate">
    <h1>LOCAL MEETING ROOM</h1>
    <p>SMA Negeri 4 Kota Ternate</p>
    <small>Ruang rapat video tanpa batas waktu</small>
  </div>
  <div class="formside">
    <form id="joinForm">
      <h2>Masuk ruang rapat</h2>
      <p class="sub">Isi nama dan nama ruang, lalu bagikan tautannya kepada peserta lain.</p>
      <input id="name" placeholder="Nama Anda" required maxlength="30" autocomplete="nickname">
      <input id="room" placeholder="Nama ruang, mis. rapat-guru" required pattern="[A-Za-z0-9_\-]{1,40}" title="Huruf, angka, - atau _">
      <button class="primary" type="submit">Masuk ruang</button>
      <small id="err" style="color:var(--danger)"></small>
    </form>
  </div>
</section>

<section id="call">
  <div class="main">
    <div id="grid"></div>
    <aside id="chat" aria-label="Obrolan">
      <div id="msgs"></div>
      <form id="chatForm"><input id="chatIn" placeholder="Tulis pesan" autocomplete="off"><button class="primary">Kirim</button></form>
    </aside>
  </div>
  <div class="bar">
    <span class="room"><img data-logo class="mini" alt=""><b>LOCAL MEETING ROOM</b> · <span id="roomLabel"></span> · <span id="timer">00:00:00</span></span><span id="status" role="status" style="color:var(--danger)"></span>
    <button id="bMic">Mikrofon</button>
    <button id="bCam">Kamera</button>
    <button id="bScr">Bagikan layar</button>
    <button id="bChat">Obrolan</button>
    <button id="bCopy">Salin tautan</button>
    <button id="bLeave" class="off">Keluar</button>
  </div>
</section>

document.querySelectorAll("[data-logo]").forEach((i) => (i.src = LOGO));
const $ = (id) => document.getElementById(id);
const me = 'p' + crypto.randomUUID().replace(/-/g, '').slice(0, 10);
const peers = new Map(); // id -> {pc, tile, queue, name}
// ===== PENGATURAN =====
// Tempel URL Web App Google Apps Script (berakhiran /exec) di bawah ini.
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyxEyFP7-j-jjmABjFtkhDI0gnZ8YfTZ_IUuavhGdRfgyGvvQDTqv7ZgolKV0in55rt/exec',
  ICE_SERVERS: [{ urls: 'stun:stun.l.google.com:19302' }],
  // Tambahkan TURN bila perlu: { urls: 'turn:host:3478', username: '...', credential: '...' }
};
let room, myName, local, ice, camTrack, screenStream;

// Isi dari tautan ?room=...
const qs = new URLSearchParams(location.search);
if (qs.get('room')) $('room').value = qs.get('room');
$('name').value = localStorage.getItem('mr-name') || '';

$('joinForm').onsubmit = async (e) => {
  e.preventDefault();
  myName = $('name').value.trim(); room = $('room').value.trim();
  if (!CONFIG.API_URL) { $('err').textContent = 'API_URL belum diisi di index.html (lihat README).'; return; }
  try { localStorage.setItem('mr-name', myName); } catch {}
  try {
    local = await getMedia();
  } catch (err) {
    $('err').textContent = 'Kamera/mikrofon tidak bisa diakses. Pastikan izin diberikan dan halaman dibuka lewat HTTPS.';
    return;
  }
  camTrack = local.getVideoTracks()[0];
  ice = { iceServers: CONFIG.ICE_SERVERS };
  $('join').style.display = 'none';
  $('call').classList.add('open');
  $('roomLabel').textContent = room;
  history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  addTile(me, myName + ' (Anda)', local, true);
  startTimer();
  connect();
};

async function getMedia() {
  try { return await navigator.mediaDevices.getUserMedia({ video: true, audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { return await navigator.mediaDevices.getUserMedia({ audio: true }); } // tanpa kamera
}

let alive = true, since = 0;
const outbox = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const status = (t) => ($('status').textContent = t ? ' · ' + t : '');

// Satu fungsi untuk semua panggilan ke Google Sheets (via Apps Script).
// Tanpa header Content-Type agar browser tidak mengirim preflight CORS.
async function api(body) {
  const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function connect() {
  try {
    const j = await api({ action: 'join', room, id: me, name: myName });
    since = j.since;
    // Pendatang baru yang memulai offer ke semua peserta yang sudah ada
    j.peers.forEach((p) => makePeer(p.id, p.name, true));
  } catch (err) { status('Gagal tersambung ke Google Sheets: ' + err.message); return; }
  loop();
}

// Polling: kirim pesan keluar dan ambil pesan masuk dalam satu permintaan.
async function loop() {
  while (alive) {
    const out = outbox.splice(0);
    let busy = false;
    try {
      const r = await api({ action: 'sync', room, id: me, name: myName, since, out });
      status('');
      since = r.since;
      const names = Object.fromEntries(r.peers.map((p) => [p.id, p.name]));
      for (const s of r.signals) await onSignal(s, names);
      reconcile(r.peers);
      busy = r.signals.length > 0 || out.length > 0;
    } catch (err) {
      outbox.unshift(...out);
      status('Koneksi ke Google Sheets terganggu, mencoba lagi');
    }
    await sleep(busy ? 250 : 800);
  }
}

async function onSignal({ from, to, data }, names) {
  if (to === '*') return addMsg(names[from] || 'Tamu', data.chat || '');
  const p = peers.get(from) || makePeer(from, names[from] || 'Tamu', false);
  try {
    if (data.sdp) {
      await p.pc.setRemoteDescription(data.sdp);
      if (data.sdp.type === 'offer') {
        await p.pc.setLocalDescription(await p.pc.createAnswer());
        post(from, { sdp: p.pc.localDescription });
      }
      p.queue.splice(0).forEach((c) => p.pc.addIceCandidate(c).catch(() => {}));
    } else if (data.ice) {
      if (p.pc.remoteDescription) p.pc.addIceCandidate(data.ice).catch(() => {});
      else p.queue.push(data.ice);
    }
  } catch (err) { console.error(err); }
}

// Peserta yang hilang dari daftar 3 kali berturut-turut dianggap sudah keluar.
function reconcile(list) {
  const ids = new Set(list.map((p) => p.id));
  for (const [id, p] of [...peers]) {
    if (ids.has(id)) p.miss = 0;
    else if (++p.miss >= 3) removePeer(id);
  }
}

function post(to, data) { outbox.push({ to, data }); }

function makePeer(id, name, initiator) {
  const pc = new RTCPeerConnection(ice);
  const p = { pc, queue: [], name, tile: null, miss: 0 };
  peers.set(id, p);
  local.getTracks().forEach((t) => pc.addTrack(t, local));
  const remote = new MediaStream();
  p.tile = addTile(id, name, remote, false);
  pc.ontrack = (e) => remote.addTrack(e.track);
  pc.onicecandidate = (e) => e.candidate && post(id, { ice: e.candidate });
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' && initiator) pc.restartIce();
  };
  if (initiator) {
    pc.onnegotiationneeded = async () => {
      await pc.setLocalDescription(await pc.createOffer());
      post(id, { sdp: pc.localDescription });
    };
  }
  return p;
}

function removePeer(id) {
  const p = peers.get(id); if (!p) return;
  p.pc.close(); p.tile.remove(); peers.delete(id);
}

function addTile(id, name, stream, mine) {
  const t = document.createElement('div');
  t.className = 'tile' + (mine ? ' me' : '');
  const v = document.createElement('video');
  v.autoplay = true; v.playsInline = true; v.muted = mine; v.srcObject = stream;
  const s = document.createElement('span'); s.textContent = name;
  t.append(v, s); $('grid').append(t);
  return t;
}

// Kontrol
function toggle(btn, kind, label) {
  const tr = local.getTracks().find((t) => t.kind === kind);
  if (!tr) { btn.disabled = true; return; }
  tr.enabled = !tr.enabled;
  btn.classList.toggle('off', !tr.enabled);
  btn.textContent = tr.enabled ? label : label + ' mati';
}
$('bMic').onclick = (e) => toggle(e.currentTarget, 'audio', 'Mikrofon');
$('bCam').onclick = (e) => toggle(e.currentTarget, 'video', 'Kamera');
if (!navigator.mediaDevices) $('err').textContent = 'Browser ini tidak mendukung kamera. Gunakan HTTPS.';

$('bScr').onclick = async () => {
  const tile = document.querySelector('.tile.me');
  if (screenStream) return stopShare();
  try { screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch { return; }
  const tr = screenStream.getVideoTracks()[0];
  tr.onended = stopShare;
  await swapVideo(tr);
  tile.classList.add('screen'); tile.querySelector('video').srcObject = screenStream;
  $('bScr').classList.add('on'); $('bScr').textContent = 'Hentikan berbagi';
};
async function stopShare() {
  if (!screenStream) return;
  screenStream.getTracks().forEach((t) => t.stop()); screenStream = null;
  if (camTrack) await swapVideo(camTrack);
  const tile = document.querySelector('.tile.me');
  tile.classList.remove('screen'); tile.querySelector('video').srcObject = local;
  $('bScr').classList.remove('on'); $('bScr').textContent = 'Bagikan layar';
}
async function swapVideo(track) {
  for (const { pc } of peers.values()) {
    const s = pc.getSenders().find((x) => x.track && x.track.kind === 'video');
    if (s) await s.replaceTrack(track);
  }
}

// Chat
$('bChat').onclick = () => $('chat').classList.toggle('open');
$('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const text = $('chatIn').value.trim(); if (!text) return;
  post('*', { chat: text }); addMsg('Anda', text); $('chatIn').value = '';
};
function addMsg(who, text) {
  const d = document.createElement('div');
  const b = document.createElement('b'); b.textContent = who + ': ';
  d.append(b, document.createTextNode(text));
  $('msgs').append(d); $('msgs').scrollTop = 1e9;
}

$('bCopy').onclick = async (e) => {
  try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Tersalin'; setTimeout(() => (e.target.textContent = 'Salin tautan'), 1500); } catch {}
};
$('bLeave').onclick = () => { leaveRoom(); peers.forEach((_, id) => removePeer(id)); local.getTracks().forEach((t) => t.stop()); location.reload(); };

function leaveRoom() {
  alive = false;
  try { navigator.sendBeacon(CONFIG.API_URL, JSON.stringify({ action: 'leave', room, id: me })); } catch {}
}
addEventListener('pagehide', () => room && leaveRoom());

// Stopwatch hanya penunjuk durasi; tidak ada batas.
function startTimer() {
  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('timer').textContent = [s / 3600, (s / 60) % 60, s % 60].map((n) => String(Math.floor(n)).padStart(2, '0')).join(':');
  }, 1000);
}

// Jaga layar tetap menyala selama rapat panjang
async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && $('call').classList.contains('open') && keepAwake());
$('joinForm').addEventListener('submit', keepAwake);
</script>
</body>
</html>
